<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f7fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="受付">
<meta name="application-name" content="三条河原町店 受付">
<meta name="description" content="スプレッドシートの料金ロジックを再現した受付・入室管理アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>三条河原町店 受付・料金計算</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#fbfcff; --line:#dfe5ef;
    --txt:#1b2437; --muted:#66748f; --accent:#2f6fed; --accent2:#0f9d76;
    --warn:#96601a; --danger:#d64545; --gold:#b45309; --soft:#eef2f9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(47,111,237,.15)}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:linear-gradient(180deg,#f9fbfe,#eef3fb 60%,#f5f7fb);
       color:var(--txt);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
       font-size:15px;line-height:1.6;min-height:100vh;min-height:100dvh;
       overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
  header{padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 14px calc(18px + env(safe-area-inset-left));
         border-bottom:1px solid var(--line);
         background:rgba(255,255,255,.93);position:sticky;top:0;z-index:20;
         -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  header h1{margin:0;font-size:19px;letter-spacing:.02em;color:#13203a}
  header .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .wrap{max-width:1180px;margin:0 auto;
        padding:18px calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .grid{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:14px;padding:16px 16px 18px;margin-bottom:16px;
        box-shadow:0 6px 18px rgba(23,43,77,.06)}
  .card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;color:#16233d}
  .card h2 .tag{font-size:11px;color:var(--muted);font-weight:400;border:1px solid var(--line);
        border-radius:20px;padding:1px 8px;background:var(--soft)}
  label{display:block;font-size:12.5px;color:#4c5a75;margin-bottom:4px}
  input,select{width:100%;background:#fff;color:var(--txt);border:1px solid #cfd8e6;
        border-radius:9px;padding:10px;font-size:16px;font-family:inherit;
        min-height:44px;-webkit-appearance:none;appearance:none}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=date],input[type=time]{min-width:0;text-align:left}
  select{background-color:#fff;
        background-image:linear-gradient(45deg,transparent 50%,#5b6b88 50%),linear-gradient(135deg,#5b6b88 50%,transparent 50%);
        background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;
        background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.15);background:#fff}
  .row{display:grid;gap:10px;margin-bottom:12px}
  .row.c2{grid-template-columns:1fr 1fr}
  .row.c4{grid-template-columns:repeat(4,1fr)}
  .row.c3{grid-template-columns:1.1fr 1.1fr 1.3fr}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  [hidden]{display:none !important}
  .stepper{display:flex;align-items:stretch;border:1px solid #cfd8e6;border-radius:9px;
        background:#fff;overflow:hidden;min-height:44px}
  .stepper input{border:0;border-radius:0;text-align:center;min-height:42px;padding:8px 2px;
        font-weight:700;font-size:16px}
  .stepper input:focus{box-shadow:none}
  .stepbtn{flex:0 0 42px;width:42px;border:0;background:var(--soft);color:var(--accent);
        font-size:19px;font-weight:700;line-height:1;cursor:pointer;touch-action:manipulation;
        -webkit-appearance:none;appearance:none;padding:0}
  .stepbtn:active{background:#dce7fb}
  .stepper .minus{border-right:1px solid #e3e9f3}
  .stepper .plus{border-left:1px solid #e3e9f3}
  .btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit;
       cursor:pointer;font-weight:600;color:#fff;background:var(--accent);
       min-height:44px;-webkit-appearance:none;appearance:none;touch-action:manipulation;
       box-shadow:0 2px 6px rgba(47,111,237,.22)}
  .btn:hover{filter:brightness(1.06)}
  .btn.enter{background:linear-gradient(135deg,#12b886,#0b9c72);font-size:17px;padding:14px;width:100%;
       letter-spacing:.06em;box-shadow:0 4px 14px rgba(15,157,118,.28)}
  .btn.enter:disabled{background:#dbe2ec;color:#8d99ad;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid #cfd8e6;color:#44546f;font-weight:500;font-size:13px;
       padding:7px 11px;box-shadow:none}
  .btn.ghost:hover{background:var(--soft)}
  .enterrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
  .enterrow .btn.enter{width:auto;min-width:150px;padding:14px 22px}
  @media (max-width:560px){.enterrow{grid-template-columns:1fr}.enterrow .btn.enter{width:100%}}
  .hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .hactions{display:flex;gap:8px;flex-wrap:wrap}
  .ioshint{margin-top:8px;background:#eef4ff;border:1px dashed #b9cdf3;border-radius:9px;
       padding:8px 10px;font-size:12.5px;color:#27406e}
  @media print{header{position:static}}
  .total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
        background:linear-gradient(135deg,#f2f7ff,#eaf1ff);border:1px solid #d5e3fb;border-radius:12px;
        padding:12px 14px;margin-bottom:12px}
  .total .lab{color:#4c5a75;font-size:13px}
  .total .val{font-size:30px;font-weight:800;color:var(--gold);letter-spacing:.01em}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:7px 8px;border-bottom:1px solid #e8edf5;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  thead th{color:#5b6b88;font-weight:600;font-size:12px;border-bottom:1px solid #d3ddec}
  tbody tr.sub td{color:var(--muted)}
  tfoot td{font-weight:700;border-top:1px solid #cbd6e8;border-bottom:0}
  .pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);
        background:var(--soft);color:#5b6b88;margin:0 6px 6px 0}
  .pill b{color:#1b2437;font-weight:700}
  .pill.ok{border-color:#9fdcc7;background:#e8f8f2;color:#0f7a5c}
  .pill.warn{border-color:#f0c98a;background:#fff6e6;color:#8a5a12}
  .rec{background:#eef4ff;border:1px dashed #b9cdf3;border-radius:10px;padding:10px 12px;
       font-size:13px;color:#27406e;margin-top:12px;white-space:pre-line}
  .warnbox{background:#fff6e6;border:1px solid #f0c98a;color:#8a5a12;border-radius:10px;
       padding:9px 11px;font-size:12.5px;margin-top:10px}
  .logs{overflow-x:auto}
  .logs td,.logs th{white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;padding:10px 0}
  details.inner{margin-top:4px}
  summary.more{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;
       padding:8px 10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;
       list-style:none;user-select:none}
  summary.more::-webkit-details-marker{display:none}
  summary.more::before{content:'＋ ';font-weight:700}
  details.inner[open] summary.more::before{content:'－ '}
  details.inner[open] summary.more{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
  details.inner table{margin-top:2px}
  details{margin-top:12px}
  summary{cursor:pointer;color:var(--muted);font-size:12.5px}
  details pre{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:10px;
       font-size:11.5px;overflow-x:auto;color:#33456b}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>三条河原町店 受付</h1>
      <div class="sub">入力すると料金が自動で更新されます。</div>
    </div>
    <div class="hactions">
      <button class="btn ghost" id="btnInstall" type="button" hidden>ホーム画面に追加</button>
      <button class="btn ghost" id="btnReload" type="button" title="キャッシュを消して最新版に更新">更新</button>
    </div>
  </div>
  <div class="ioshint" id="iosHint" hidden></div>
</header>
<div class="wrap">
  <div class="grid">
    <!-- ============ 入力 ============ -->
    <div>
      <div class="card">
        <h2>① 日時 <span class="tag">任意</span></h2>
        <div class="row c2">
          <div><label>日付</label><input type="date" id="inDate"></div>
          <div><label>時刻</label><input type="time" id="inTime"></div>
        </div>
        <div class="row c2" style="margin-bottom:4px">
          <button class="btn ghost" id="btnNow">自動判定に戻す</button>
          <button class="btn ghost" id="btnQuick">今の日時を入力</button>
        </div>
        <div class="hint" id="autoNote"></div>
      </div>

      <div class="card">
        <h2>② 人数 <span class="tag">F39:I39</span></h2>
        <div class="row c4">
          <div><label>会員学生</label>
            <div class="stepper">
              <button type="button" class="stepbtn minus" data-target="c0" aria-label="会員学生を減らす">−</button>
              <input type="number" min="0" step="1" inputmode="numeric" placeholder="0" id="c0" aria-label="会員学生の人数">
              <button type="button" class="stepbtn plus" data-target="c0" aria-label="会員学生を増やす">＋</button>
            </div></div>
          <div><label>学生</label>
            <div class="stepper">
              <button type="button" class="stepbtn minus" data-target="c1" aria-label="学生を減らす">−</button>
              <input type="number" min="0" step="1" inputmode="numeric" placeholder="0" id="c1" aria-label="学生の人数">
              <button type="button" class="stepbtn plus" data-target="c1" aria-label="学生を増やす">＋</button>
            </div></div>
          <div><label>会員</label>
            <div class="stepper">
              <button type="button" class="stepbtn minus" data-target="c2" aria-label="会員を減らす">−</button>
              <input type="number" min="0" step="1" inputmode="numeric" placeholder="0" id="c2" aria-label="会員の人数">
              <button type="button" class="stepbtn plus" data-target="c2" aria-label="会員を増やす">＋</button>
            </div></div>
          <div><label>一般</label>
            <div class="stepper">
              <button type="button" class="stepbtn minus" data-target="c3" aria-label="一般を減らす">−</button>
              <input type="number" min="0" step="1" inputmode="numeric" placeholder="0" id="c3" aria-label="一般の人数">
              <button type="button" class="stepbtn plus" data-target="c3" aria-label="一般を増やす">＋</button>
            </div></div>
        </div>
        <div class="hint">合計 <b id="peopleOut">2</b> 名</div>
      </div>

      <div class="card">
        <h2>③ 時間・部屋・コース</h2>
        <div class="row">
          <div><label>利用時間・プラン</label><select id="inJikan"></select>
            <div class="hint">数値＝時間制／パック＝フリータイム</div></div>
        </div>
        <div class="row">
          <div><label>部屋番号</label><select id="inRoom"></select>
            <div class="hint" id="roomNote"></div></div>
        </div>
        <div class="row" style="margin-bottom:0">
          <div><label>コース</label><select id="inCourse"></select>
            <div class="hint" id="courseNote"></div></div>
        </div>
      </div>
    </div>

    <!-- ============ 料金 ============ -->
    <div>
      <div class="card">
        <h2>④ 料金</h2>
        <div class="total"><span class="lab">合計料金</span><span class="val" id="outTotal">¥0</span></div>
        <div id="pills"></div>
        <details class="inner" id="breakdownBox">
          <summary class="more">内訳を表示</summary>
          <table id="breakdown">
            <thead><tr><th>区分</th><th>単価</th><th>回数</th><th>人数</th><th>金額</th></tr></thead>
            <tbody></tbody>
            <tfoot></tfoot>
          </table>
        </details>
        <div class="rec" id="outRec"></div>
        <div id="outWarn"></div>
        <details>
          <summary>セル対応表</summary>
          <pre id="formulaMap"></pre>
        </details>
      </div>

      <div class="card">
        <h2>⑤ 入室</h2>
        <div class="enterrow">
          <div>
            <label>担当者</label>
            <select id="inStaff"></select>
            <input type="text" id="inStaffNew" placeholder="氏名を入力" autocomplete="off" hidden>
          </div>
          <button class="btn enter" id="btnEnter">入　室</button>
        </div>
        <div class="hint">押した時点の内容を履歴に記録します。</div>
        <div class="row c2" style="margin-top:12px">
          <button class="btn ghost" id="btnCsv">CSV</button>
          <button class="btn ghost" id="btnClear">クリア</button>
        </div>
        <div class="logs" id="logWrap" style="margin-top:10px"></div>
      </div>
    </div>
  </div>

<script>
/* =======================================================================
   三条河原町店 料金エンジン（スプレッドシート「d」の数式を忠実に移植）
   ======================================================================= */
const DATA = JSON.parse(document.getElementById('data-json').textContent);
const WEEKDAYS = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
const KEYS = ['会員学生','学生','会員','一般'];
const PACKS = ['昼FT','夕方FT','夜FT','深夜FT','ナイトパック'];

const pad2 = n => String(n).padStart(2,'0');
const ymd  = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const hhmm = d => pad2(d.getHours())+':'+pad2(d.getMinutes());
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
function groupNum(v){   // toLocaleString に依存しない桁区切り（古いSafari・一部WebView対策）
  const s = String(v), neg = s.charAt(0) === '-', d = neg ? s.slice(1) : s;
  const out = d.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return neg ? '-' + out : out;
}
const yen = n => '¥' + groupNum(Math.round(n));
const cfgOf = name => DATA.configs.find(c=>c.name===name) || null;
const roomOf = no => DATA.rooms.find(r=>r.no===Number(no)) || null;
const courseOf = n => DATA.courses.find(c=>c.name===n) || null;

/* --- D4 / E4 / F4 の再現 ------------------------------------------------
   D4 = text(now(),"hh:mm")                    … 現在時刻（指定があればそれ）
   E4 = if(hour(now())<=5, today()-1, today()) … 5時以前は前日営業日
   F4 = vlookup(E4, CW:CX, 2, 0)               … 曜日構成（祝日情報）
------------------------------------------------------------------------ */
function resolveDateTime(inDate, inTime){
  const now = new Date();
  const time = inTime || hhmm(now);
  let date, src;
  if(inDate){ date = inDate; src = '指定'; }
  else{
    const h = Number(time.split(':')[0]);
    const base = new Date(now);
    if(h <= 5) base.setDate(base.getDate()-1);
    date = ymd(base); src = '自動判定（シートのE4と同じ規則）';
  }
  const inTable = Object.prototype.hasOwnProperty.call(DATA.dates, date);
  let config = DATA.dates[date] || null;
  if(!config){                       // 日付テーブル範囲外 → 曜日でフォールバック
    const [y,m,d] = date.split('-').map(Number);
    config = WEEKDAYS[new Date(y,m-1,d).getDay()];
  }
  return {date, time, config, autoSrc:src, inTable, timeAuto: !inTime};
}

/* --- 本体：料金計算 ----------------------------------------------------- */
function computePricing(st){
  const {counts, jikan, roomNo, courseName, inDate, inTime} = st;
  const dt = resolveDateTime(inDate, inTime);
  const cfg = cfgOf(dt.config);
  const room = roomOf(roomNo);
  const course = courseOf(courseName);
  const people = KEYS.reduce((a,k)=>a+(counts[k]||0),0);
  const noJikan = (jikan === '' || jikan === null || jikan === undefined) ||
                  (typeof jikan === 'number' && !isFinite(jikan));
  const jikanNum = noJikan ? null : (typeof jikan === 'number' ? jikan : parseFloat(jikan));
  const isFT = noJikan ? null : !(jikanNum > 0);   // E6 = if(J39*1>0,"時間制","FT")
  const E6 = noJikan ? '—' : (isFT ? 'FT' : '時間制');
  const P = k => (cfg && cfg.prices[k] != null) ? cfg.prices[k] : 0;
  const ready = !noJikan && !!room && !!course;    // 時間・部屋・コースが揃うと見積り開始

  /* BL3 = Sの回数（19:00までの30分単位数, 上限=J39*2）
     BM3 = Nの回数（総単位数 - Sの回数） */
  let BL3 = null, BM3 = null;
  if(ready && !isFT){
    BL3 = (dt.time > '19:00') ? null
        : Math.min(Math.ceil((19*60 - toMin(dt.time))/30), jikanNum*2);
    const rest = jikanNum*2 - (BL3 || 0);
    BM3 = rest === 0 ? null : rest;
  }

  /* 人数ぶんの料金（G12:BJ13）
     2名以上 → 通常会員種別列／1名 → 「ひとり」列
     S列はBL3、N列はBM3、FT列は1を乗算 */
  const items = [];
  const addItems = (prefix, units) => {
    if(units == null) return;
    KEYS.forEach(k=>{
      const c = counts[k]||0;
      if(c<=0) return;
      const label = prefix + k + (people===1 ? 'ひとり' : '');
      const price = P(label);
      items.push({label, price, units, count:c, amount:price*units*c});
    });
  };
  if(ready){
    if(!isFT){
      addItems('S', BL3);    // G13:N13
      addItems('N', BM3);    // O13:V13
    }else{
      addItems(jikan, 1);    // W13:BJ13（パック列, 乗算1）
    }
  }
  const personTotal = items.reduce((a,i)=>a+i.amount,0);

  /* E7 コンセプト判定（部屋料金）= 部屋単価 × 人数 ×（時間制なら J39*2） */
  const roomRate = ready ? (isFT ? room.ft : room.jikan) : 0;
  const roomUnits = ready ? (isFT ? 1 : jikanNum*2) : 0;
  const roomCharge = ready ? roomRate * people * roomUnits : 0;

  /* E8 コース料金 = コース単価 × 人数（時間制＝時間帯列／FT＝FT列） */
  const coursePrice = !ready ? null
      : (isFT ? course.ft : (course.hours[String(jikanNum)] != null ? course.hours[String(jikanNum)] : null));
  const courseCharge = (ready && coursePrice != null) ? coursePrice * people : null;

  /* E13 合計料金 */
  const total = personTotal + roomCharge + (courseCharge == null ? 0 : courseCharge);

  /* E41 おすすめ文 */
  let rec = '';
  if(ready && course && people>0 && courseCharge != null){
    const perHead = Math.ceil((total/people)/10)*10;   // roundup(...,-1)
    rec = '只今のお時間、'+course.desc+'がおかわり自由にご利用いただけて、\n'
        + 'お1人様あたり'+perHead+'の物がオススメですが、いかがなさいますか？';
  }
  return {dt, cfg, room, course, people, isFT, E6, ready, noJikan, BL3, BM3, items, personTotal,
          roomRate, roomUnits, roomCharge, coursePrice, courseCharge, total, rec,
          jikanNum, jikanRaw:jikan};
}

(function buildSelects(){

  PACKS.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; g2.appendChild(o); });
  jk.appendChild(g1); jk.appendChild(g2);

  const rm = $('inRoom');

  const groups = {};
  DATA.rooms.forEach(r=>{
    const f = String(r.no).slice(0,1);
    (groups[f] = groups[f] || document.createElement('optgroup')).label = f+'階';
    const o=document.createElement('option'); o.value=r.no;

  Object.keys(groups).sort().forEach(f=>rm.appendChild(groups[f]));

  const cs = $('inCourse');
  const ph3 = document.createElement('option'); ph3.value=''; ph3.textContent='選択してください'; cs.appendChild(ph3);
  DATA.courses.forEach(c=>{
    const o=document.createElement('option'); o.value=c.name;
    o.textContent = c.name+'（FT '+c.ft+'）';
    cs.appendChild(o);
  });
})();

/* --- 履歴（localStorage） --- */
const LSKEY = 'sanjokawaramachi-nyushitsu-log-v1';
let logs = [];
try{ logs = JSON.parse(localStorage.getItem(LSKEY) || '[]'); }catch(e){ logs = []; }
if(!Array.isArray(logs)) logs = [];
const saveLogs = () => { try{ localStorage.setItem(LSKEY, JSON.stringify(logs)); }catch(e){} };

/* --- 担当者：入力候補を localStorage に蓄積（新しい氏名は次回から選択肢に出る） --- */
const STAFFKEY = 'sanjokawaramachi-staff-v1';
let staff = [];
try{ staff = JSON.parse(localStorage.getItem(STAFFKEY) || '[]'); }catch(e){ staff = []; }
if(!Array.isArray(staff)) staff = [];
const saveStaff = () => { try{ localStorage.setItem(STAFFKEY, JSON.stringify(staff)); }catch(e){} };
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderStaff(){
  const sel = $('inStaff'); if(!sel) return;
  const cur = sel.value;                       // 選択は「値」で復元（index 依存にしない）
  let html = '<option value="">選択してください</option>';
  html += staff.map(n=>'<option value="'+escHtml(n)+'">'+escHtml(n)+'</option>').join('');
  html += '<option value="__new__">＋ 新しい担当者を入力…</option>';
  sel.innerHTML = html;
  if(cur === '__new__' || staff.indexOf(cur) >= 0){ sel.value = cur; }
}
function addStaff(name){
  const n = String(name||'').trim().replace(/\s+/g,' ');
  if(!n) return '';
  if(staff.indexOf(n) === -1){ staff.push(n); saveStaff(); renderStaff(); }
  return n;
}
logs.forEach(l=>{ if(l && l.staff) addStaff(l.staff); });   // 過去の記録からも候補を復元
renderStaff();

function renderLogs(){
  const w = $('logWrap');
  if(!logs.length){ w.innerHTML = '<div class="empty">記録なし</div>'; return; }
  const rows = logs.map(l=>`<tr>
      <td>${l.enteredAt}</td>
      <td>${l.staff||'—'}</td>
      <td>${l.breakdown}</td>
      <td>${l.jikan}</td>
      <td>${l.course}</td>
      <td>${l.room}</td>
      <td>${l.mode}</td>
      <td style="font-weight:700;color:var(--gold)">${yen(l.total)}</td></tr>`).join('');
  w.innerHTML = `<table class="logs"><thead><tr><th>入室時刻</th><th>担当者</th><th>人数</th>
    <th>時間</th><th>コース</th><th>部屋</th><th>判定</th><th>料金</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* --- 描画 --- */
function render(){
  const s = state();
  const r = computePricing(s);
  $('peopleOut').textContent = r.people;

  const pills = [];
  pills.push(`<span class="pill">FT判定：<b>${r.E6}</b></span>`);
  pills.push(`<span class="pill ${r.dt.inTable?'ok':'warn'}">曜日構成：<b>${r.dt.config}</b></span>`);
  pills.push(`<span class="pill">営業日：<b>${r.dt.date}</b></span>`);
  pills.push(`<span class="pill">時刻：<b>${r.dt.time}</b></span>`);
  if(r.isFT === false){
    pills.push(`<span class="pill">Sの回数：<b>${r.BL3==null?'—':r.BL3}</b></span>`);
    pills.push(`<span class="pill">Nの回数：<b>${r.BM3==null?'—':r.BM3}</b></span>`);
  }
  $('pills').innerHTML = pills.join('');

  const tb = $('breakdown').querySelector('tbody');
  const tf = $('breakdown').querySelector('tfoot');
  let html = '';
  if(r.items.length){
    r.items.forEach(i=>{ html += `<tr><td>${i.label}</td><td>${yen(i.price)}</td><td>${i.units}</td>
      <td>${i.count}</td><td>${yen(i.amount)}</td></tr>`; });
    html += `<tr class="sub"><td colspan="4">人数ぶん小計</td><td>${yen(r.personTotal)}</td></tr>`;
  }else{
    html += `<tr class="sub"><td colspan="5">${r.ready ? '該当なし' : '人数・時間・部屋・コースを入力してください'}</td></tr>`;
  }
  if(r.ready){
    html += `<tr><td>部屋料金<br><span class="hint">${r.room?r.room.no:''} 単価${yen(r.roomRate)} × ${r.people}名 × ${r.roomUnits}${r.isFT?'':'（30分単位）'}</span></td>
             <td>${yen(r.roomRate)}</td><td>${r.roomUnits}</td><td>${r.people}</td><td>${yen(r.roomCharge)}</td></tr>`;
    html += `<tr><td>コース料金<br><span class="hint">${r.course?r.course.name:''} 単価${r.coursePrice==null?'—':yen(r.coursePrice)} × ${r.people}名</span></td>
             <td>${r.coursePrice==null?'—':yen(r.coursePrice)}</td><td>1</td><td>${r.people}</td>
             <td>${r.courseCharge==null?'—':yen(r.courseCharge)}</td></tr>`;
  }
  tb.innerHTML = html;
  tf.innerHTML = `<tr><td>合計料金</td><td colspan="3"></td><td style="color:var(--gold);font-size:17px">${r.ready ? yen(r.total) : '—'}</td></tr>`;
  $('outTotal').textContent = r.ready ? yen(r.total) : '—';
  $('outRec').textContent = r.rec || '—';

  const warn = [];
  if(!r.dt.inTable) warn.push(`日付テーブル範囲外（${r.dt.date}）：曜日のみで判定、祝日設定なし`);
  if(!r.ready) warn.push('人数・時間・部屋・コースを入力すると料金を表示します');
  if(r.ready && r.courseCharge == null) warn.push('料金表にない組み合わせ（コース料金0）');
  if(r.ready && r.people === 0) warn.push('人数を入力してください');
  if(r.dt.timeAuto) warn.push(`時刻は現在時刻（${r.dt.time}）で自動判定`);
  $('outWarn').innerHTML = warn.map(w=>`<div class="warnbox">${w}</div>`).join('');

  const room = r.room;
  $('roomNote').textContent = room ? `時間制 ${room.jikan}／FT ${room.ft}（1名・30分）` : '';
  const course = r.course;
  $('courseNote').textContent = course ? `${course.desc}／FT ${course.ft}` : '';
  $('autoNote').textContent = r.dt.timeAuto ? '日時は自動判定' : '日時は指定どおり';
  $('btnEnter').disabled = !(r.people>0 && r.courseCharge!=null);
  $('formulaMap').textContent =
`D4=時刻 / E4=営業日(5時前は前日) / F4=曜日構成
E6=時間制 or FT
BL3=min(roundup((19:00-D4)*48), J39*2) / BM3=J39*2-BL3
G13:BJ13=人数×単価×(S:BL3 / N:BM3 / FT:1)
E7=部屋単価×人数×(時間制:J39*2 / FT:1)
E8=コース単価×人数
E13=E7+E8+sum(F13:BJ13)`;
}

/* --- 入室 --- */
$('btnEnter').addEventListener('click', ()=>{
  const s = state();
  const r = computePricing(s);
  if(!r.ready){ return; }          // 時間・部屋・コースが揃うまで記録しない（保険）
  const now = new Date();
  const selStaff = $('inStaff') ? $('inStaff').value : '';
  const staffName = (selStaff === '__new__') ? addStaff($('inStaffNew').value) : addStaff(selStaff);
  const breakdown = KEYS.filter(k=>(s.counts[k]||0)>0).map(k=>`${k}${s.counts[k]}`).join(' / ') || '0名';
  logs.unshift({
    enteredAt: `${ymd(now)} ${hhmm(now)}:${pad2(now.getSeconds())}`,
    breakdown,
    jikan: r.isFT ? r.jikanRaw : (r.jikanNum+'時間'),
    course: r.course ? r.course.name : '',
    room: r.room ? r.room.no : '',
    mode: `${r.E6}／${r.dt.config}`,
    total: r.total,
    staff: staffName,
    counts: s.counts, date: r.dt.date, time: r.dt.time
  });
  saveLogs(); renderLogs();
  if($('inStaffNew')){ $('inStaffNew').value = ''; $('inStaffNew').hidden = true; }
  if($('inStaff') && staffName){ $('inStaff').value = staffName; }   // 次の入力でも同じ担当者を維持
  const b = $('btnEnter'); b.textContent = '記録しました ✓'; b.disabled = true;
  setTimeout(()=>{ b.textContent = '入　室'; render(); }, 1200);
});
$('btnClear').addEventListener('click', ()=>{
  if(confirm('入室履歴をすべて削除しますか？')){ logs = []; saveLogs(); renderLogs(); }
});
$('btnCsv').addEventListener('click', ()=>{
  const head = ['入室時刻','担当者','人数内訳','利用時間','コース','部屋番号','判定','合計料金'];
  const body = logs.map(l=>[l.enteredAt,l.staff||'',l.breakdown,l.jikan,l.course,l.room,l.mode,l.total]);
  const csv = '\uFEFF' + [head, ...body].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'nyushitsu_log_'+ymd(new Date())+'.csv'; a.click();
  URL.revokeObjectURL(a.href);
});
$('btnNow').addEventListener('click', ()=>{ $('inDate').value=''; $('inTime').value=''; render(); });
$('btnQuick').addEventListener('click', ()=>{ const n=new Date(); $('inDate').value=ymd(n); $('inTime').value=hhmm(n); render(); });

/* 人数の±ボタン：入力ボックス内のボタンで増減（0で停止／空欄のまま−は何もしない） */
document.querySelectorAll('.stepbtn').forEach(function(b){
  b.addEventListener('click', function(){
    const inp = $(b.getAttribute('data-target'));
    if(!inp) return;
    const isPlus = b.classList.contains('plus');
    if(!isPlus && String(inp.value).trim() === ''){ return; }
    let cur = parseInt(inp.value, 10);
    if(isNaN(cur)) cur = 0;
    const next = isPlus ? cur + 1 : Math.max(0, cur - 1);
    inp.value = String(next);
    inp.dispatchEvent(new Event('input', {bubbles:true}));
    inp.dispatchEvent(new Event('change', {bubbles:true}));
  });
});
/* 担当者：プルダウンで「＋ 新しい担当者を入力…」を選んだら入力欄を表示 */
if($('inStaff')){
  $('inStaff').addEventListener('change', function(){
    const isNew = this.value === '__new__';
    if($('inStaffNew')){
      $('inStaffNew').hidden = !isNew;
      if(isNew){ try{ $('inStaffNew').focus(); }catch(e){} }
    }
  });
}
['c0','c1','c2','c3','inJikan','inRoom','inCourse','inDate','inTime'].forEach(id=>{
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});
render(); renderLogs();

/* =======================================================================
   端末・ブラウザ差の吸収（iOS Safari / Android Chrome / PC Chrome・Edge・Firefox）
   ======================================================================= */
/* 1) 時刻を自動判定にしている間は30秒ごとに再計算（受付中に料金が変わるため） */
setInterval(function(){ if(!$('inTime').value){ render(); } }, 30000);

/* 2) ホーム画面に追加（PWA） */
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) === true ||
         window.navigator.standalone === true;
}
var deferredPrompt = null;
var btnInstall = $('btnInstall'), iosHint = $('iosHint');
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e; if(btnInstall){ btnInstall.hidden = false; }
});
window.addEventListener('appinstalled', function(){ if(btnInstall){ btnInstall.hidden = true; } });
if(btnInstall){
  btnInstall.addEventListener('click', function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; btnInstall.hidden = true; });
    } else if(iosHint){
      iosHint.hidden = !iosHint.hidden;
    }
  });
}
if(isIOS){
  if(btnInstall){ btnInstall.hidden = true; }
  if(iosHint && !isStandalone()){
    iosHint.hidden = false;
    iosHint.textContent = 'Safariの共有 → ホーム画面に追加';
  }
}
function hardRefresh(){
  var done = false;
  function go(){
    if(done) return; done = true;
    try{ location.replace(location.pathname + '?v=' + Date.now()); }
    catch(e){ location.reload(); }
  }
  try{
    var tasks = [];
    if(window.caches && caches.keys){
      tasks.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }).catch(function(){}));
    }
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }).catch(function(){}));
    }
    if(!tasks.length){ go(); return; }
    Promise.all(tasks).then(go).catch(go);
    setTimeout(go, 1500);
  }catch(e){ go(); }
}
if($('btnReload')){ $('btnReload').addEventListener('click', hardRefresh); }

/* 3) サービスワーカー（https配信時のみ。ローカルファイルやfile://では自動的にスキップ） */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){
    try{
      navigator.serviceWorker.register('sw.js?v=5', {updateViaCache:'none'}).then(function(reg){
        if(reg.update){ try{ reg.update(); }catch(e){} }
        if(reg.waiting){ try{ reg.waiting.postMessage('SKIP_WAITING'); }catch(e){} }
        if(reg.addEventListener){
          reg.addEventListener('updatefound', function(){
            var w = reg.installing;
            if(!w) return;
            w.addEventListener('statechange', function(){
              if(w.state === 'installed' && navigator.serviceWorker.controller){
                try{ w.postMessage('SKIP_WAITING'); }catch(e){}
              }
            });
          });
        }
      }).catch(function(){});
    }catch(e){}
  });
}

/* 4) 画面回転・表示領域変化（iOSのアドレスバー伸縮）に追従 */
window.addEventListener('orientationchange', function(){ setTimeout(function(){ render(); }, 250); });
</script>
